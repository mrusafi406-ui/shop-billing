<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maruf Traders Billing</title>
<style>
:root{--g:#0f766e;--bg:#eef3f2;--ink:#12302d;--mut:#64807c;--ac:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:150px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
header small{font-weight:400;font-size:12px;opacity:.9}
.pad{padding:12px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0002;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:#fff;border-radius:14px;padding:8px;box-shadow:0 1px 4px #0002;position:relative;font-size:13px}
.p svg{width:100%;height:110px}
.pr{font-weight:700;font-size:12px;text-align:center}
.nm{margin-top:4px;color:var(--mut)}
.b{position:absolute;top:6px;right:6px;background:var(--ac);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
input,select{width:100%;padding:12px;border:1px solid #b9cbc8;border-radius:10px;font-size:16px;margin:4px 0 10px;background:#fff}
button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--g);color:#fff}
button:disabled{opacity:.4}
button.o{background:#fff;color:var(--g);border:1px solid var(--g)}
button.r{background:#dc2626}
.w{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chips button{padding:8px 14px;white-space:nowrap;background:#fff;color:var(--g);border:1px solid var(--g)}
.chips button.on{background:var(--g);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px #0002;z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #cfdcd9;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 0}
nav button.on{color:var(--g);border-top:3px solid var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #cfdcd9}
.mo{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
.mo>div{background:#fff;border-radius:14px;width:86%;padding:16px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat div{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0002}
.stat b{display:block;font-size:20px;color:var(--g)}
#memo{background:#fff;padding:14px;border-radius:6px;font-size:13px;box-shadow:0 1px 4px #0002}
#memo .c{text-align:center}
#memo table{width:100%;border-collapse:collapse}
#memo td,#memo th{padding:4px 2px;border-bottom:1px dashed #999;text-align:left;vertical-align:top}
#memo td:last-child,#memo th:last-child{text-align:right}
@media print{body *{visibility:hidden}#memo,#memo *{visibility:visible}#memo{position:absolute;left:0;top:0;width:100%;box-shadow:none}}
@page{size:104mm auto;margin:3mm}
</style></head><body><div id="app"></div><script>
const CFG={name:'MARUF TRADERS',tag:'Beverage & Confectionery Distribution',addr:'Market Road, Your City',phone:'01XXXXXXXXX'};
// id, name, category, price per pcs, pcs per carton, color, shape
const P=[
[1,'Cola Fizz Pet 250ml','Cold Drinks',18,24,'#7c2d12','bottle'],
[2,'Lemon Splash Pet 250ml','Cold Drinks',18,24,'#84cc16','bottle'],
[3,'Orange Pop Can 250ml','Cold Drinks',43,24,'#f97316','can'],
[4,'Cola Fizz Pet 500ml','Cold Drinks',30,12,'#7c2d12','bottle'],
[5,'Soda Water Pet 1L','Cold Drinks',48,12,'#0284c7','bottle'],
[6,'Mango Juice Box 200ml','Juice',20,24,'#f59e0b','box'],
[7,'Orange Juice Pet 250ml','Juice',25,24,'#ea580c','bottle'],
[8,'Litchi Drink Can 250ml','Juice',35,24,'#db2777','can'],
[9,'Mixed Fruit Juice 1L','Juice',95,12,'#d97706','box'],
[10,'Choco Bar 25g','Chocolate',20,48,'#78350f','bar'],
[11,'Milk Choco Bar 40g','Chocolate',35,36,'#92400e','bar'],
[12,'Hazelnut Wafer 30g','Chocolate',15,60,'#b45309','bar'],
[13,'Dark Choco Bar 50g','Chocolate',55,24,'#3f1d0b','bar'],
[14,'Mineral Water Pet 500ml','Water',10,24,'#0ea5e9','bottle'],
[15,'Mineral Water Pet 2L','Water',35,6,'#0369a1','bottle']];
const CATS=['All','Cold Drinks','Juice','Chocolate','Water'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tk=n=>'৳'+Number(n).toFixed(2);
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ld=()=>{try{return JSON.parse(localStorage.memos||'[]')}catch(e){return[]}};
const sv=a=>{try{localStorage.memos=JSON.stringify(a)}catch(e){}};
const pd=id=>P.find(p=>p[0]==id);
const line=(p,q)=>q.c*p[3]*p[4]+q.p*p[3];
const qs=q=>[q.c?q.c+' Ctn':'',q.p?q.p+' Pcs':''].filter(Boolean).join(' + ');
function tot(c){let t=0,u=0;for(const id in c){const p=pd(id),q=c[id];t+=line(p,q);u+=q.c*p[4]+q.p}return{t,u,n:Object.keys(c).length}}
let S={tab:'order',shop:null,cart:{},cat:'All',view:'cat',pay:'Cash',memo:null,rd:td(),all:false};

function art(s,c,n){const w=n.split(' ')[0].toUpperCase().slice(0,7);let b='';
if(s=='bottle')b=`<rect x="40" y="6" width="20" height="12" rx="3" fill="#333"/><path d="M38 18h24v14c0 8 12 14 12 28v50a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V60c0-14 12-20 12-28z" fill="${c}"/><rect x="26" y="64" width="48" height="28" fill="#fff" opacity=".9"/>`;
else if(s=='can')b=`<rect x="26" y="12" width="48" height="100" rx="8" fill="${c}"/><rect x="26" y="12" width="48" height="10" rx="5" fill="#cfd8dc"/><rect x="26" y="60" width="48" height="28" fill="#fff" opacity=".9"/>`;
else if(s=='box')b=`<path d="M56 4l-4 18" stroke="#444" stroke-width="3"/><rect x="26" y="20" width="48" height="92" rx="4" fill="${c}"/><rect x="26" y="58" width="48" height="28" fill="#fff" opacity=".9"/>`;
else b=`<rect x="16" y="24" width="68" height="78" rx="4" fill="${c}"/><rect x="16" y="24" width="68" height="12" fill="#e5e7eb"/><rect x="16" y="60" width="68" height="28" fill="#fff" opacity=".9"/>`;
return `<svg viewBox="0 0 100 120">${b}<text x="50" y="${s=='bottle'?82:80}" font-size="${s=='bar'?11:9}" font-weight="700" text-anchor="middle" fill="${c}">${w}</text></svg>`}

function render(){
 const T={order:'New Order',memos:'Saved Memos',report:'Sales Report'};
 let h=`<header><div>${esc(CFG.name)}<br><small>${T[S.tab]}</small></div>${S.shop&&S.tab=='order'?`<small>${esc(S.shop.name)}</small>`:''}</header>`;
 h+=S.tab=='order'?orderV():S.tab=='memos'?memosV():reportV();
 h+=`<nav>${[['order','Order'],['memos','Memos'],['report','Report']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>`;
 $('#app').innerHTML=h}
function go(t){S.tab=t;S.memo=null;if(S.view=='memo'){S.shop=null;S.cart={};S.view='cat'}render();scrollTo(0,0)}
function newO(){S.shop=null;S.cart={};S.view='cat';S.memo=null;render()}
function chg(){if(Object.keys(S.cart).length&&!confirm('Clear the current order?'))return;newO()}
function startO(){const n=$('#sn').value.trim();if(!n){alert('Please enter the shop name');return}S.shop={name:n,phone:$('#sp').value.trim(),addr:$('#sa').value.trim()};S.cart={};S.view='cat';render()}

function orderV(){
 if(!S.shop)return `<div class="pad"><div class="card"><b>Shop details</b><br><br>Shop name<input id="sn" placeholder="e.g. Rahim General Store">Phone (optional)<input id="sp" type="tel">Address / market (optional)<input id="sa"><button class="w" onclick="startO()">Start order</button></div></div>`;
 if(S.view=='memo'&&S.memo)return `<div class="pad">${memoH(S.memo)}<br><button class="w" onclick="window.print()">Print memo</button><br><br><button class="o w" onclick="newO()">New order</button></div>`;
 const T=tot(S.cart);
 if(S.view=='rev')return `<div class="pad"><div class="card"><b>Review order</b>${Object.keys(S.cart).map(id=>{const p=pd(id),q=S.cart[id];return `<div class="row"><span>${p[1]}<br><small>${qs(q)}</small></span><b>${tk(line(p,q))}</b></div>`}).join('')}<div class="row"><b>Total</b><b>${tk(T.t)}</b></div><br>Payment<select onchange="S.pay=this.value"><option ${S.pay=='Cash'?'selected':''}>Cash</option><option ${S.pay=='Due'?'selected':''}>Due</option></select></div><button class="w" onclick="conf()">Create memo</button><br><br><button class="o w" onclick="S.view='cat';render()">Back to products</button></div>`;
 const L=P.filter(p=>S.cat=='All'||p[2]==S.cat);
 return `<div class="pad"><div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Shop: <b>${esc(S.shop.name)}</b></span><button class="o" onclick="chg()">Change</button></div><div class="chips">${CATS.map(c=>`<button class="${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${L.map(p=>{const q=S.cart[p[0]];return `<div class="p" onclick="openQ(${p[0]})">${q?`<span class="b">${qs(q)}</span>`:''}${art(p[6],p[5],p[1])}<div class="pr">Ctn ${tk(p[3]*p[4])} / Pcs ${tk(p[3])}</div><div class="nm"><b>${p[0]+1000}</b><br>${p[1]}<br>${p[4]} pcs per ctn</div></div>`}).join('')}</div></div><div class="bar"><span>${T.n} items · <b>${tk(T.t)}</b></span><button onclick="S.view='rev';render()" ${T.n?'':'disabled'}>Next</button></div>`}

function openQ(id){const p=pd(id),q=S.cart[id]||{c:0,p:0},d=document.createElement('div');d.className='mo';
 d.innerHTML=`<div><b>${p[1]}</b><br><small>${p[4]} pcs per carton</small><br><br>Ctn<input id="qc" type="number" min="0" inputmode="numeric" value="${q.c}">Pcs<input id="qp" type="number" min="0" inputmode="numeric" value="${q.p}"><div style="display:flex;gap:8px"><button class="r" style="flex:1" onclick="this.closest('.mo').remove()">Cancel</button><button style="flex:1" id="qo">OK</button></div></div>`;
 document.body.append(d);
 $('#qo').onclick=()=>{const c=Math.max(0,parseInt($('#qc').value)||0),n=Math.max(0,parseInt($('#qp').value)||0);if(c||n)S.cart[id]={c,p:n};else delete S.cart[id];d.remove();render()}}

function conf(){const T=tot(S.cart);if(!T.n)return;const a=ld(),lt=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString(),date=lt.slice(0,10);
 const m={no:'INV-'+date.replace(/-/g,'').slice(2)+'-'+String(a.filter(x=>x.date==date).length+1).padStart(3,'0'),date,time:lt.slice(11,16),shop:S.shop,pay:S.pay,total:T.t,units:T.u,
 lines:Object.keys(S.cart).map(id=>{const p=pd(id),q=S.cart[id];return{id:+id,n:p[1],q:qs(q),u:q.c*p[4]+q.p,a:line(p,q)}})};
 a.push(m);sv(a);S.memo=m;S.view='memo';render()}

function memoH(m){return `<div id="memo"><div class="c"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="26" fill="#0f766e"/><path d="M14 38V16l13 14 13-14v22" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg><div style="font-size:17px;font-weight:800">${esc(CFG.name)}</div>${esc(CFG.tag)}<br>${esc(CFG.addr)} · ${esc(CFG.phone)}<hr><b>INVOICE MEMO</b></div><div class="row"><span>No: ${m.no}</span><span>${m.date} ${m.time}</span></div><div>Shop: <b>${esc(m.shop.name)}</b>${m.shop.addr?'<br>'+esc(m.shop.addr):''}${m.shop.phone?'<br>'+esc(m.shop.phone):''}</div><br><table><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>${m.lines.map(l=>`<tr><td>${esc(l.n)}</td><td>${l.q}</td><td>${tk(l.a)}</td></tr>`).join('')}</table><div class="row"><b>Total (${m.units} pcs)</b><b>${tk(m.total)}</b></div><div class="row"><span>Payment</span><b>${m.pay}</b></div><p class="c">Thank you for your order!<br><small>Delivered by: ____________</small></p></div>`}

function memosV(){
 if(S.memo)return `<div class="pad">${memoH(S.memo)}<br><button class="w" onclick="window.print()">Print memo</button><br><br><button class="o w" onclick="S.memo=null;render()">Back</button></div>`;
 const a=ld().map((m,i)=>[m,i]).reverse();
 return `<div class="pad">${a.map(([m,i])=>`<div class="card" onclick="S.memo=ld()[${i}];render()"><div class="row" style="border:0"><b>${esc(m.shop.name)}</b><b>${tk(m.total)}</b></div><small>${m.no} · ${m.date} ${m.time} · ${m.pay}</small></div>`).join('')||'<p>No memos yet. Create your first order from the Order tab.</p>'}</div>`}

function reportV(){const all=ld(),a=S.all?all:all.filter(m=>m.date==S.rd),sum=f=>a.filter(f).reduce((s,m)=>s+m.total,0),pr={},sh={};
 a.forEach(m=>{sh[m.shop.name]=(sh[m.shop.name]||0)+m.total;m.lines.forEach(l=>pr[l.n]=(pr[l.n]||0)+l.a)});
 const top=o=>Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,5).map(e=>`<div class="row"><span>${esc(e[0])}</span><b>${tk(e[1])}</b></div>`).join('')||'<p>No data for this period.</p>';
 return `<div class="pad"><div style="display:flex;gap:8px"><input type="date" value="${S.rd}" onchange="S.rd=this.value;S.all=false;render()"><button class="${S.all?'':'o'}" style="height:48px;margin-top:4px" onclick="S.all=!S.all;render()">All time</button></div><div class="stat"><div>Total sales<b>${tk(sum(()=>1))}</b></div><div>Memos<b>${a.length}</b></div><div>Cash<b>${tk(sum(m=>m.pay=='Cash'))}</b></div><div>Due<b>${tk(sum(m=>m.pay=='Due'))}</b></div></div><div class="card"><b>Top products</b>${top(pr)}</div><div class="card"><b>Top shops</b>${top(sh)}</div><button class="o w" onclick="seed()">Add sample data (demo)</button></div>`}

function seed(){const a=ld(),n=['Rahim General Store','Sadia Variety Store','Hasan Confectionery','City Fresh Mart','Noor Tea Stall'];
 for(let i=0;i<6;i++){const lines=[];let t=0,u=0;for(let k=0;k<3;k++){const p=P[(i*3+k*5)%P.length],q={c:k%2,p:2+k*3+i%3},l={id:p[0],n:p[1],q:qs(q),u:q.c*p[4]+q.p,a:line(p,q)};lines.push(l);t+=l.a;u+=l.u}
 a.push({no:'INV-DEMO-'+(i+1),date:td(),time:'1'+i+':20',shop:{name:n[i%5],phone:'',addr:''},pay:i%3?'Cash':'Due',total:t,units:u,lines})}
 sv(a);render()}
render();
</script></body></html>
